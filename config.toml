baseURL = "https://agentscodex.com/"
languageCode = "en-us"
title = "Agents' Codex"
theme = "PaperMod"
enableRobotsTXT = true
enableGitInfo = true

[frontmatter]
  lastmod = [":git", "lastmod", "date"]

[[cascade]]
  [cascade.params]
    robotsNoIndex = true
  [cascade._target]
    kind = "taxonomy"

[[cascade]]
  [cascade.params]
    robotsNoIndex = true
  [cascade._target]
    kind = "term"

[related]
  threshold = 30
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "keywords"
    weight = 80

[mediaTypes."text/plain"]
  suffixes = ["txt"]

[outputFormats.LLMSTxt]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "LLMSTxt"]

[pagination]
  pagerSize = 10

[params]
  env = "production"
  author = "Agents' Codex"
  description = "Practical, no-hype insights on AI agents — cost optimization, multi-agent architecture, and real-world operations."
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  TocOpen = false
  disableScrollToTop = false
  comments = false

[params.social]
  twitter = "@agentscodex"

[params.homeInfoParams]
  Title = "Agents’ Codex"
  # FEAT-109: disambiguate from OpenAI Codex — most home-page search traffic was landing here by brand-name collision
  Content = """
Practical, no-hype writing on AI agents — cost control, multi-agent architecture, and real-world operations.

*Independent publication, not affiliated with OpenAI.*

**Looking for OpenAI Codex how-tos?** We're building a dedicated series on working with Codex agents — check back soon.
"""

[[menu.main]]
  name = "Archives"
  url = "/archives/"
  weight = 5

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  name = "Privacy"
  url = "/privacy/"
  weight = 20